# Pre-commit hooks configuration for qontinui-devtools
# See https://pre-commit.com for more information

repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  # Python linting (ruff-format removed; ruff lint kept)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]

  # Note: flake8 dropped in favor of ruff (same lints, unified config).
  # Note: Mypy disabled in pre-commit - run manually with: poetry run mypy
  # Pre-commit mypy runs in isolated env which causes dependency issues
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.8.0
  #   hooks:
  #     - id: mypy
  #       additional_dependencies: [types-all]
  #       args: ["--ignore-missing-imports", "--no-strict-optional"]

  # qontinui-devtools specific checks
  - repo: local
    hooks:
      - id: check-circular-imports
        name: Check for circular imports
        entry: poetry run python -m qontinui_devtools.ci.pre_commit_hooks check-circular-imports
        language: system
        types: [python]
        pass_filenames: true

      - id: check-god-classes
        name: Check for god classes
        entry: poetry run python -m qontinui_devtools.ci.pre_commit_hooks check-new-god-classes
        language: system
        types: [python]
        pass_filenames: true
        args: ["--min-lines=700", "--min-methods=50", "--max-lcom=1.1"]

      - id: check-race-conditions
        name: Check for race conditions
        entry: poetry run python -m qontinui_devtools.ci.pre_commit_hooks check-race-conditions
        language: system
        types: [python]
        pass_filenames: true
        args: ["--severity=high"]
        exclude: ^(examples/|python/tests/|scripts/|python/qontinui_devtools/brobot_migration/)

      - id: check-complexity
        name: Check cyclomatic complexity
        entry: poetry run python -m qontinui_devtools.ci.pre_commit_hooks check-complexity
        language: system
        types: [python]
        pass_filenames: true
        args: ["--max-complexity=40"]

# Global settings
default_language_version:
  python: python3.13

# Skip certain files
exclude: |
  (?x)^(
      \.git/|
      \.pytest_cache/|
      __pycache__/|
      \.venv/|
      venv/|
      build/|
      dist/|
      \.eggs/|
      .*\.egg-info/
  )

# Configuration for specific hooks
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
